<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brenda IDE</title>
  <style>
    :root {
      --bg-dark: #121018;
      --bg-panel: #1b1726;
      --bg-active: #28213b;
      --accent: #9d4edd;
      --accent-hover: #b05fe6;
      --text: #e0dcf0;
      --text-dim: #9890b0;
      --border: #312948;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Topbar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions { display: flex; gap: 8px; }
    button {
      background: var(--bg-active);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s ease;
    }
    button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Layout principal */
    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
      overflow: hidden;
    }

    /* Sidebar / File Tree */
    aside {
      width: 250px;
      min-width: 200px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 10px 14px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      list-style: none;
    }
    .file-item {
      padding: 6px 14px;
      font-size: 0.85rem;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover, .file-item.active {
      background: var(--bg-active);
      color: var(--text);
    }

    /* Editor Container */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      overflow: hidden;
    }

    /* Tabs Bar */
    .tabs-bar {
      display: flex;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--text-dim);
      background: transparent;
      border-right: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .tab.active {
      background: var(--bg-dark);
      color: var(--accent);
      border-top: 2px solid var(--accent);
    }
    .tab .close-tab {
      border-radius: 50%;
      padding: 2px;
      line-height: 1;
      font-size: 0.75rem;
    }
    .tab .close-tab:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* Editor Textarea */
    .editor-wrapper {
      flex: 1;
      position: relative;
    }
    #codeEditor {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text);
      border: none;
      outline: none;
      resize: none;
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
      white-space: pre;
      tab-size: 2;
    }
    .placeholder-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🟣</span> Brenda IDE
    </div>
    <div class="actions">
      <button id="btnOpenFolder">📂 Abrir Pasta (Dental-Tech)</button>
      <button id="btnSaveFile">💾 Salvar (Ctrl+S)</button>
    </div>
  </header>

  <main>
    <aside>
      <div class="sidebar-header">Explorador de Arquivos</div>
      <ul class="file-tree" id="fileList"></ul>
    </aside>

    <section class="editor-section">
      <div class="tabs-bar" id="tabsBar"></div>
      <div class="editor-wrapper" id="editorWrapper">
        <div class="placeholder-msg" id="emptyState">Abra uma pasta ou selecione um arquivo para editar</div>
        <textarea id="codeEditor" style="display: none;" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <script>
    const state = {
      files: new Map(), // path -> { name, content, handle, isDirty }
      openTabs: [],     // array de paths
      activeTab: null
    };

    const fileListEl = document.getElementById('fileList');
    const tabsBarEl = document.getElementById('tabsBar');
    const codeEditor = document.getElementById('codeEditor');
    const emptyState = document.getElementById('emptyState');
    const btnOpenFolder = document.getElementById('btnOpenFolder');
    const btnSaveFile = document.getElementById('btnSaveFile');

    // Abrir pasta inteira do projeto
    btnOpenFolder.addEventListener('click', async () => {
      try {
        if (!window.showDirectoryPicker) {
          alert('Seu navegador não suporta acesso a diretórios. Utilize Chrome, Edge ou Opera.');
          return;
        }
        const dirHandle = await window.showDirectoryPicker();
        state.files.clear();
        state.openTabs = [];
        state.activeTab = null;
        fileListEl.innerHTML = '';
        renderTabs();

        await readDirectory(dirHandle, '');
        renderFileList();
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    });

    async function readDirectory(dirHandle, path) {
      for await (const entry of dirHandle.values()) {
        const fullPath = path ? `${path}/${entry.name}` : entry.name;
        if (entry.kind === 'file') {
          const file = await entry.getFile();
          const text = await file.text();
          state.files.set(fullPath, {
            name: entry.name,
            content: text,
            handle: entry,
            isDirty: false
          });
        } else if (entry.kind === 'directory' && !entry.name.startsWith('.') && entry.name !== 'node_modules') {
          await readDirectory(entry, fullPath);
        }
      }
    }

    function renderFileList() {
      fileListEl.innerHTML = '';
      for (const [path, fileObj] of state.files.entries()) {
        const li = document.createElement('li');
        li.className = `file-item ${state.activeTab === path ? 'active' : ''}`;
        li.textContent = path;
        li.onclick = () => openFileInTab(path);
        fileListEl.appendChild(li);
      }
    }

    function openFileInTab(path) {
      if (!state.openTabs.includes(path)) {
        state.openTabs.push(path);
      }
      switchTab(path);
    }

    function switchTab(path) {
      state.activeTab = path;
      const current = state.files.get(path);

      if (current) {
        emptyState.style.display = 'none';
        codeEditor.style.display = 'block';
        codeEditor.value = current.content;
      } else {
        emptyState.style.display = 'flex';
        codeEditor.style.display = 'none';
      }

      renderTabs();
      renderFileList();
    }

    function closeTab(path, e) {
      e.stopPropagation();
      state.openTabs = state.openTabs.filter(p => p !== path);
      if (state.activeTab === path) {
        state.activeTab = state.openTabs.length ? state.openTabs[state.openTabs.length - 1] : null;
      }
      switchTab(state.activeTab);
    }

    function renderTabs() {
      tabsBarEl.innerHTML = '';
      state.openTabs.forEach(path => {
        const fileObj = state.files.get(path);
        const tab = document.createElement('div');
        tab.className = `tab ${state.activeTab === path ? 'active' : ''}`;
        tab.textContent = fileObj ? fileObj.name : path;

        const closeBtn = document.createElement('span');
        closeBtn.className = 'close-tab';
        closeBtn.textContent = '✕';
        closeBtn.onclick = (e) => closeTab(path, e);

        tab.appendChild(closeBtn);
        tab.onclick = () => switchTab(path);
        tabsBarEl.appendChild(tab);
      });
    }

    // Atualização de conteúdo ao digitar
    codeEditor.addEventListener('input', () => {
      if (!state.activeTab) return;
      const fileObj = state.files.get(state.activeTab);
      if (fileObj) {
        fileObj.content = codeEditor.value;
        fileObj.isDirty = true;
      }
    });

    // Salvar arquivo
    async function saveCurrentFile() {
      if (!state.activeTab) return;
      const fileObj = state.files.get(state.activeTab);
      if (!fileObj || !fileObj.handle) return;

      try {
        const writable = await fileObj.handle.createWritable();
        await writable.write(fileObj.content);
        await writable.close();
        fileObj.isDirty = false;
      } catch (err) {
        console.error('Erro ao salvar:', err);
      }
    }

    btnSaveFile.addEventListener('click', saveCurrentFile);

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveCurrentFile();
      }
    });
  </script>
</body>
</html>
