<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1715">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brenda IDE">
  <link rel="manifest" href="manifest.json">
  <title>Brenda IDE — HTML Live</title>
  <style>
    :root{
      --bg:#0f1715; --panel:#151f1c; --panel2:#1b2824; --line:#2a3935;
      --text:#eaf4f1; --muted:#98aaa5; --accent:#42d8bb; --accent2:#76ead3;
      --danger:#ff776f; --shadow:0 14px 44px rgba(0,0,0,.28);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:max(10px,env(safe-area-inset-top)) 14px 10px;
      border-bottom:1px solid var(--line);background:rgba(15,23,21,.96);backdrop-filter:blur(14px);
      z-index:10;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#1cae93);display:grid;place-items:center;color:#06251f;font-weight:900}
    .title{font-weight:900;letter-spacing:-.02em}
    .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{
      border:1px solid var(--line);background:var(--panel2);color:var(--text);
      border-radius:11px;padding:9px 12px;font-weight:750;min-height:40px;
    }
    .btn.primary{background:var(--accent);color:#07251f;border-color:transparent}
    .btn.danger{color:#ffc1bd}
    .workspace{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
    .pane{min-width:0;min-height:0;background:var(--panel);display:grid;grid-template-rows:auto 1fr}
    .pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line)}
    .pane-title{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .status{font-size:11px;color:var(--muted)}
    textarea{
      width:100%;height:100%;resize:none;border:0;outline:0;background:#111a18;color:#dff8f2;
      padding:16px 18px 80px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-size:14px;line-height:1.55;tab-size:2;caret-color:var(--accent2);
      -webkit-overflow-scrolling:touch;
    }
    iframe{width:100%;height:100%;border:0;background:#fff}
    footer{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      border-top:1px solid var(--line);background:var(--panel);padding:8px 12px max(8px,env(safe-area-inset-bottom));
      font-size:11px;color:var(--muted)
    }
    .mobile-tabs{display:none}
    .toast{
      position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(15px);
      background:#eaf4f1;color:#101815;padding:10px 14px;border-radius:12px;font-weight:800;
      opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow);z-index:30
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;padding:18px;z-index:40}
    .modal.show{display:grid}
    .card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
    .card h3{margin:0 0 8px}.card p{color:var(--muted);line-height:1.45}
    .row{display:flex;gap:8px}.row .btn{flex:1}
    input[type=file]{display:none}
    @media(max-width:760px){
      header{align-items:flex-start}
      .top-actions .desktop-only{display:none}
      .workspace{grid-template-columns:1fr}
      .pane{display:none}
      .pane.active{display:grid}
      .mobile-tabs{display:flex;gap:6px}
      .mobile-tabs .btn{padding:7px 10px;min-height:34px}
      .sub{max-width:54vw}
    }
    @media(min-width:761px){
      .pane{display:grid!important}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">&lt;/&gt;</div>
      <div>
        <div class="title">Brenda IDE</div>
        <div class="sub" id="fileName">projeto.html • autosave ativo</div>
      </div>
    </div>
    <div class="top-actions">
      <label class="btn" for="fileInput">Abrir</label>
      <input id="fileInput" type="file" accept=".html,.htm,text/html">
      <button class="btn desktop-only" id="newBtn">Novo</button>
      <button class="btn" id="downloadBtn">Salvar .html</button>
      <button class="btn primary desktop-only" id="fullPreviewBtn">Preview</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane active" id="editorPane">
      <div class="pane-head">
        <div class="pane-title">HTML</div>
        <div class="mobile-tabs">
          <button class="btn primary" data-tab="editor">Código</button>
          <button class="btn" data-tab="preview">Preview</button>
        </div>
        <div class="status" id="saveStatus">salvo</div>
      </div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </section>

    <section class="pane" id="previewPane">
      <div class="pane-head">
        <div class="pane-title">Preview em tempo real</div>
        <div class="mobile-tabs">
          <button class="btn" data-tab="editor">Código</button>
          <button class="btn primary" data-tab="preview">Preview</button>
        </div>
        <div class="status" id="previewStatus">atualizado</div>
      </div>
      <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
    </section>
  </main>

  <footer>
    <span>⌘/Ctrl + S baixa o HTML</span>
    <span id="charCount">0 caracteres</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="newModal">
  <div class="card">
    <h3>Novo arquivo</h3>
    <p>Isso substitui o código aberto no editor. O arquivo atual continuará salvo automaticamente neste navegador.</p>
    <div class="row">
      <button class="btn" id="cancelNew">Cancelar</button>
      <button class="btn danger" id="confirmNew">Criar novo</button>
    </div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const saveStatus = document.getElementById('saveStatus');
const previewStatus = document.getElementById('previewStatus');
const fileNameEl = document.getElementById('fileName');
const charCount = document.getElementById('charCount');
const fileInput = document.getElementById('fileInput');
const toastEl = document.getElementById('toast');

let currentFileName = localStorage.getItem('brendaide_filename') || 'projeto.html';
let updateTimer;

const starter = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu projeto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
  </style>
</head>
<body>
  <h1>Olá 👋</h1>
  <p>Edite o HTML e veja o resultado ao lado.</p>
</body>
</html>`;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function setFileName(name){
  currentFileName = name || 'projeto.html';
  if(!/\.html?$/i.test(currentFileName)) currentFileName += '.html';
  localStorage.setItem('brendaide_filename', currentFileName);
  fileNameEl.textContent = currentFileName + ' • autosave ativo';
}

function render(){
  preview.srcdoc = editor.value;
  previewStatus.textContent = 'atualizado agora';
  charCount.textContent = editor.value.length.toLocaleString('pt-BR') + ' caracteres';
}

function persist(){
  localStorage.setItem('brendaide_code', editor.value);
  saveStatus.textContent = 'salvo';
}

function scheduleUpdate(){
  saveStatus.textContent = 'salvando...';
  previewStatus.textContent = 'atualizando...';
  clearTimeout(updateTimer);
  updateTimer = setTimeout(()=>{
    persist();
    render();
  }, 220);
}

editor.value = localStorage.getItem('brendaide_code') || starter;
setFileName(currentFileName);
render();

editor.addEventListener('input', scheduleUpdate);

editor.addEventListener('keydown', (e)=>{
  if(e.key === 'Tab'){
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.setRangeText('  ', start, end, 'end');
    scheduleUpdate();
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    downloadHtml();
  }
});

fileInput.addEventListener('change', async ()=>{
  const file = fileInput.files?.[0];
  if(!file) return;
  editor.value = await file.text();
  setFileName(file.name);
  persist();
  render();
  toast('Arquivo aberto');
  fileInput.value = '';
});

function downloadHtml(){
  const blob = new Blob([editor.value], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  persist();
  toast('HTML salvo');
}
document.getElementById('downloadBtn').addEventListener('click', downloadHtml);

document.getElementById('fullPreviewBtn').addEventListener('click', ()=>{
  const blob = new Blob([editor.value], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win) toast('Permita pop-ups para abrir o preview');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
});

const newModal = document.getElementById('newModal');
document.getElementById('newBtn').addEventListener('click', ()=>newModal.classList.add('show'));
document.getElementById('cancelNew').addEventListener('click', ()=>newModal.classList.remove('show'));
document.getElementById('confirmNew').addEventListener('click', ()=>{
  editor.value = starter;
  setFileName('projeto.html');
  persist(); render();
  newModal.classList.remove('show');
  toast('Novo arquivo criado');
});

document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    document.getElementById('editorPane').classList.toggle('active', tab === 'editor');
    document.getElementById('previewPane').classList.toggle('active', tab === 'preview');
  });
});

window.addEventListener('beforeunload', persist);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
